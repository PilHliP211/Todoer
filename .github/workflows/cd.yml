name: CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    name: Build & deploy (staging)
    runs-on: ubuntu-latest
    environment: staging

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev" --quiet

      - name: Resolve image metadata
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${GCP_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPO}/${CLOUD_RUN_SERVICE_NAME}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: docker build -t "${{ steps.meta.outputs.image_uri }}" .

      - name: Push container image
        run: docker push "${{ steps.meta.outputs.image_uri }}"

      - name: Deploy to Cloud Run (staging)
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
        run: |
          deploy_args=(
            --project "${GCP_PROJECT_ID}"
            --region "${GCP_REGION}"
            --service-account "${RUNTIME_SERVICE_ACCOUNT}"
            --image "${IMAGE_URI}"
            --set-env-vars "COMMIT_SHA=${GITHUB_SHA},IMAGE_TAG=${IMAGE_TAG}"
          )

          if [[ -n "${CLOUD_RUN_MIN_INSTANCES:-}" ]]; then
            deploy_args+=(--min-instances "${CLOUD_RUN_MIN_INSTANCES}")
          fi

          if [[ -n "${CLOUD_RUN_SECRETS:-}" ]]; then
            deploy_args+=(--set-secrets "${CLOUD_RUN_SECRETS}")
          fi

          gcloud run deploy "${CLOUD_RUN_SERVICE_NAME}" "${deploy_args[@]}" --quiet

  deploy-prod:
    name: Promote to production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (prod)
        env:
          IMAGE_TAG: ${{ needs.deploy-staging.outputs.image_tag }}
          IMAGE_URI: ${{ needs.deploy-staging.outputs.image_uri }}
        run: |
          deploy_args=(
            --project "${GCP_PROJECT_ID}"
            --region "${GCP_REGION}"
            --service-account "${RUNTIME_SERVICE_ACCOUNT}"
            --image "${IMAGE_URI}"
            --set-env-vars "COMMIT_SHA=${GITHUB_SHA},IMAGE_TAG=${IMAGE_TAG}"
          )

          if [[ -n "${CLOUD_RUN_MIN_INSTANCES:-}" ]]; then
            deploy_args+=(--min-instances "${CLOUD_RUN_MIN_INSTANCES}")
          fi

          if [[ -n "${CLOUD_RUN_SECRETS:-}" ]]; then
            deploy_args+=(--set-secrets "${CLOUD_RUN_SECRETS}")
          fi

          gcloud run deploy "${CLOUD_RUN_SERVICE_NAME}" "${deploy_args[@]}" --quiet
