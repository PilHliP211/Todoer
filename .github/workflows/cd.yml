name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options:
          - staging
          - prod
        default: staging
        required: true
      ref:
        description: Branch or SHA to deploy (defaults to the triggering commit)
        required: false

jobs:
  deploy-staging:
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')) ||
        (github.event_name == 'workflow_dispatch' &&
        (inputs.environment == 'staging' || inputs.environment == 'prod')) }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (staging)
        run: npm run migrate

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev"

      - name: Compute image metadata
        id: meta
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          IMAGE="${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${COMMIT_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "${{ steps.meta.outputs.image }}" .

      - name: Push image
        run: docker push "${{ steps.meta.outputs.image }}"

      - name: Deploy to Cloud Run (staging)
        run: |
          set -euo pipefail
          deploy_args=(
            run deploy "${{ vars.CLOUD_RUN_SERVICE }}"
            --image "${{ steps.meta.outputs.image }}"
            --region "${{ vars.GCP_REGION }}"
            --project "${{ vars.GCP_PROJECT_ID }}"
            --platform managed
            --min-instances "${{ vars.CLOUD_RUN_MIN_INSTANCES }}"
            --labels "commit-sha=${{ steps.meta.outputs.commit_sha }}"
            --set-env-vars "NODE_ENV=production,APP_VERSION=${{ steps.meta.outputs.commit_sha }},IMAGE_TAG=${{ steps.meta.outputs.image }}"
          )

          if [ -n "${{ vars.CLOUD_RUN_SECRETS }}" ]; then
            deploy_args+=(--set-secrets "${{ vars.CLOUD_RUN_SECRETS }}")
          fi

          gcloud "${deploy_args[@]}"

      - name: Fetch service URL
        id: url
        run: |
          URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run deployed integration tests
        env:
          INTEGRATION_BASE_URL: ${{ steps.url.outputs.url }}
        run: npm run test:integration:remote

  deploy-prod:
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'prod') }}
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (production)
        run: npm run migrate

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run (production)
        run: |
          set -euo pipefail
          deploy_args=(
            run deploy "${{ vars.CLOUD_RUN_SERVICE }}"
            --image "${{ needs.deploy-staging.outputs.image }}"
            --region "${{ vars.GCP_REGION }}"
            --project "${{ vars.GCP_PROJECT_ID }}"
            --platform managed
            --min-instances "${{ vars.CLOUD_RUN_MIN_INSTANCES }}"
            --labels "commit-sha=${{ needs.deploy-staging.outputs.commit_sha }}"
            --set-env-vars "NODE_ENV=production,APP_VERSION=${{ needs.deploy-staging.outputs.commit_sha }},IMAGE_TAG=${{ needs.deploy-staging.outputs.image }}"
          )

          if [ -n "${{ vars.CLOUD_RUN_SECRETS }}" ]; then
            deploy_args+=(--set-secrets "${{ vars.CLOUD_RUN_SECRETS }}")
          fi

          gcloud "${deploy_args[@]}"

      - name: Fetch service URL
        id: url
        run: |
          URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run deployed integration tests
        env:
          INTEGRATION_BASE_URL: ${{ steps.url.outputs.url }}
        run: npm run test:integration:remote
