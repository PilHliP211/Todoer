name: CD

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to build (defaults to the triggering ref)
        required: false
  push:
    branches:
      - develop
      - main

jobs:
  no-op:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Show context
        run: |
          echo "Workflow triggered by ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
