name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev"

      - name: Compute image metadata
        id: meta
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ARTIFACT_REGION: ${{ vars.GCP_ARTIFACT_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${GCP_ARTIFACT_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/todoer"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build -t "${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.image_tag }}" .
          docker push "${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.image_tag }}"

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (staging)
        run: npm run migrate

      - name: Deploy to Cloud Run (staging)
        env:
          APP_VERSION: ${{ github.sha }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES }}
          CLOUD_RUN_SECRETS: ${{ vars.CLOUD_RUN_SECRETS }}
        run: |
          DEPLOY_ARGS=(
            "--project=${GCP_PROJECT_ID}"
            "--region=${GCP_REGION}"
            "--image=${IMAGE_URI}:${IMAGE_TAG}"
            "--min-instances=${CLOUD_RUN_MIN_INSTANCES}"
            "--set-env-vars=APP_VERSION=${APP_VERSION},IMAGE_TAG=${IMAGE_TAG}"
            "--allow-unauthenticated"
          )
          if [ -n "${CLOUD_RUN_SECRETS}" ]; then
            DEPLOY_ARGS+=("--set-secrets=${CLOUD_RUN_SECRETS}")
          fi
          gcloud run deploy "${CLOUD_RUN_SERVICE}" "${DEPLOY_ARGS[@]}"

      - name: Fetch Cloud Run URL
        id: service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          SERVICE_URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format="value(status.url)")
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Run remote integration tests
        env:
          INTEGRATION_BASE_URL: ${{ steps.service.outputs.service_url }}
        run: npm run test:integration:remote

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (production)
        run: npm run migrate

      - name: Deploy to Cloud Run (production)
        env:
          APP_VERSION: ${{ github.sha }}
          IMAGE_TAG: ${{ needs.deploy-staging.outputs.image_tag }}
          IMAGE_URI: ${{ needs.deploy-staging.outputs.image_uri }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES }}
          CLOUD_RUN_SECRETS: ${{ vars.CLOUD_RUN_SECRETS }}
        run: |
          DEPLOY_ARGS=(
            "--project=${GCP_PROJECT_ID}"
            "--region=${GCP_REGION}"
            "--image=${IMAGE_URI}:${IMAGE_TAG}"
            "--min-instances=${CLOUD_RUN_MIN_INSTANCES}"
            "--set-env-vars=APP_VERSION=${APP_VERSION},IMAGE_TAG=${IMAGE_TAG}"
            "--allow-unauthenticated"
          )
          if [ -n "${CLOUD_RUN_SECRETS}" ]; then
            DEPLOY_ARGS+=("--set-secrets=${CLOUD_RUN_SECRETS}")
          fi
          gcloud run deploy "${CLOUD_RUN_SERVICE}" "${DEPLOY_ARGS[@]}"
